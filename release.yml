title: "v0.1.0-beta.6"
prerelease: true
body: |
  发布日期：2026-10-16

  - ✨️ 新增自然色系、中性色系和马卡龙色系主题色，并保留普通色系、莫兰迪色系与中国传统节气色。
  - ✨️ 增加应用刷新、文档重新加载和工作区知识快捷入口。
  - 🎨 精简设置分类，统一模板列表展示；新增和编辑模板改用弹窗，并优化打开文档列表与写作设置间距。
  - 🎨 更新 MarkFlow 品牌图标及系统托盘图标。
  - 📦️ 将应用标识更新为 `com.markflow.editor`，首次启动时迁移旧标识目录中的设置和历史数据；由于更新签名密钥轮换，beta5 用户需手动下载安装 beta6。

  > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。
