name: Check and build desktop applications

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@12.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check version consistency
        run: node scripts/version.mjs check
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: pnpm typecheck && pnpm test
      - name: Test native file service
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "${{ github.workspace }}/src-tauri/tauri.ci.conf.json"
      - uses: actions/upload-artifact@v4
        with:
          name: MarkFlow-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
